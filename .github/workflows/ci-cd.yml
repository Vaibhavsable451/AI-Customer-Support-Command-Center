name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:

  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy types-passlib

      - name: ruff check
        run: ruff check app/ scripts/ --output-format=github

      - name: ruff format check
        run: ruff format app/ scripts/ --check

      - name: mypy (strict on core modules)
        run: mypy app/core/ app/schemas/ --ignore-missing-imports


  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Unit + Integration tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_USER: support_user
          MYSQL_PASSWORD: support_pass
          MYSQL_DATABASE: support_db
          MYSQL_ROOT_PASSWORD: root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u support_user -psupport_pass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: mysql+pymysql://support_user:support_pass@localhost:3306/support_db
      SECRET_KEY: ci-test-secret-key-not-for-production
      GROQ_API_KEY: stub
      PINECONE_API_KEY: stub
      APP_ENV: test
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ \
            --tb=short \
            --asyncio-mode=auto \
            -v \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml


  # ── 3. Offline eval ───────────────────────────────────────────────────────
  eval:
    name: Offline eval (routing accuracy gate)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    env:
      DATABASE_URL: sqlite:///./eval.db
      SECRET_KEY: ci-eval-secret
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      MLFLOW_TRACKING_URI: ./mlruns
      APP_ENV: ci
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline evaluation
        run: python scripts/run_offline_eval.py

      - name: Upload MLflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-eval-run
          path: mlruns/


  # ── 4. Build & push Docker image ──────────────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image info
        run: |
          echo "### Docker Image Built 🐳" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY


  # ── 5. Deploy to Kubernetes ───────────────────────────────────────────────
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.ENABLE_K8S_DEPLOY == 'true'

    environment:
      name: production
      url: ${{ vars.EC2_PUBLIC_IP != '' && format('http://{0}:30080/docs', vars.EC2_PUBLIC_IP) || 'https://api.your-domain.com/docs' }}

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4


      # ── kubectl ────────────────────────────────────────────────────────────
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"


      # ── Kubeconfig ─────────────────────────────────────────────────────────
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"

          printf '%s' "${{ secrets.KUBE_CONFIG }}" \
            | base64 --decode \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"


      # ── Verify kubeconfig ─────────────────────────────────────────────────
      - name: Verify kubeconfig
        run: |
          echo "Current Kubernetes context:"
          kubectl config current-context

          echo "Kubernetes API server:"
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
          echo


      # ── Test connection ───────────────────────────────────────────────────
      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes


      # ── Namespace ─────────────────────────────────────────────────────────
      - name: Apply namespace
        run: |
          kubectl apply -f k8s/namespace.yaml


      # ── Production secrets ────────────────────────────────────────────────
      - name: Apply production secrets
        run: |
          kubectl create secret generic ai-support-secrets \
            --namespace ai-support \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --from-literal=PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -


      # ── ConfigMap ─────────────────────────────────────────────────────────
      - name: Apply config
        run: |
          kubectl apply -f k8s/configmap.yaml


      # ── MySQL ─────────────────────────────────────────────────────────────
      - name: Apply aws-free database
        if: vars.K8S_PROFILE == 'aws-free' || vars.EC2_PUBLIC_IP != ''
        run: |
          kubectl apply -f k8s/aws-free/mysql.yaml

          kubectl rollout status deployment/mysql \
            -n ai-support \
            --timeout=240s


      # ── API deployment ────────────────────────────────────────────────────
      - name: Apply API deployment
        run: |
          kubectl apply -f k8s/deployment.yaml


      # ── AWS FREE API configuration ───────────────────────────────────────
      - name: Configure aws-free API
        if: vars.K8S_PROFILE == 'aws-free' || vars.EC2_PUBLIC_IP != ''
        run: |
          echo "Configuring API deployment for AWS free-tier EC2..."

          # Scale API to one replica
          kubectl scale deployment/ai-support-api \
            -n ai-support \
            --replicas=1

          # Use Recreate strategy.
          # rollingUpdate MUST be removed when strategy is Recreate.
          kubectl patch deployment ai-support-api \
            -n ai-support \
            --type='merge' \
            -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'

          # Expose API through NodePort
          kubectl apply -f k8s/aws-free/api-nodeport.yaml


      # ── Update API image ──────────────────────────────────────────────────
      - name: Update API image
        run: |
          kubectl set image deployment/ai-support-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} \
            -n ai-support


      # ── Production exposure ───────────────────────────────────────────────
      - name: Apply production exposure manifests
        if: vars.K8S_PROFILE != 'aws-free' && vars.EC2_PUBLIC_IP == ''
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml


      # ── AWS FREE frontend ─────────────────────────────────────────────────
      - name: Apply aws-free frontend
        if: vars.K8S_PROFILE == 'aws-free' || vars.EC2_PUBLIC_IP != ''
        run: |
          kubectl apply -f k8s/service.yaml

          kubectl apply -f k8s/aws-free/frontend.yaml

          kubectl set image deployment/ai-support-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} \
            -n ai-support


      # ── Wait for rollout ──────────────────────────────────────────────────
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ai-support-api \
            -n ai-support \
            --timeout=180s

          if [ "${{ vars.K8S_PROFILE }}" = "aws-free" ] || [ -n "${{ vars.EC2_PUBLIC_IP }}" ]; then
            kubectl rollout status deployment/ai-support-frontend \
              -n ai-support \
              --timeout=180s
          fi


      # ── Smoke test ────────────────────────────────────────────────────────
      - name: Smoke test (readiness probe)
        run: |
          kubectl port-forward svc/ai-support-api-svc 8080:80 -n ai-support &
          PORT_FORWARD_PID=$!

          trap "kill $PORT_FORWARD_PID 2>/dev/null || true" EXIT

          sleep 5

          curl -sf http://localhost:8080/health \
            || (echo "Smoke test failed" && exit 1)

          curl -sf http://localhost:8080/ready \
            || (echo "Readiness check failed" && exit 1)

          echo "✅ Deployment smoke test passed"


      # ── Deployment summary ────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "### Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image digest:** ${{ needs.build.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ vars.K8S_PROFILE }}" = "aws-free" ] || [ -n "${{ vars.EC2_PUBLIC_IP }}" ]; then
            echo "**API:** http://${{ vars.EC2_PUBLIC_IP }}:30080/docs" >> $GITHUB_STEP_SUMMARY
            echo "**Frontend:** http://${{ vars.EC2_PUBLIC_IP }}:30085" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ai-support >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n ai-support >> $GITHUB_STEP_SUMMARY
